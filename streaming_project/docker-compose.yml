services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    user: root
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kafka-init
    depends_on:
      - kafka
    restart: "no"
    command: >
      sh -c "until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list; do sleep 2; done;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic listings_raw --partitions 1 --replication-factor 1"

  spark:
    image: apache/spark:3.5.1
    container_name: spark
    user: root
    working_dir: /app
    command: python3 -u /app/spark_stream.py
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    restart: on-failure
    environment:
      PYTHONPATH: /opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.7-src.zip
    volumes:
      - ./:/app
      - ./ivy:/tmp/ivy

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: realestate
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  producer:
    image: python:3.11-slim
    container_name: producer
    working_dir: /app
    command: sh -c "pip install -q --no-cache-dir pandas==2.2.3 kafka-python==2.0.2 && python -u producer.py"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure
    environment:
      KAFKA_SERVERS: kafka:29092
      CSV_PATH: /app/listings.csv
      STATE_FILE: /app/state/producer_offset.txt
      MSGS_PER_SEC: "20"
    volumes:
      - ./:/app

volumes:
  pgdata:
  kafkadata: