version: 2

models:
  - name: fact_listing
    columns:
      - name: listing_id
        tests:
          - not_null
          - unique
      - name: location_id
        tests:
          - relationships:
              to: ref('dim_location')
              field: location_id
      - name: property_id
        tests:
          - relationships:
              to: ref('dim_property')
              field: property_id
      - name: agent_id
        tests:
          - relationships:
              to: ref('dim_agent')
              field: agent_id
      - name: broker_id
        tests:
          - relationships:
              to: ref('dim_broker')
              field: broker_id

  - name: dim_location
    columns:
      - name: location_id
        tests:
          - not_null
          - unique

  - name: dim_property
    columns:
      - name: property_id
        tests:
          - not_null
          - unique

  - name: dim_agent
    columns:
      - name: agent_id
        tests:
          - not_null
          - unique

  - name: dim_broker
    columns:
      - name: broker_id
        tests:
          - not_null
          - unique
